<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEKxAI Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #005CDA;
      --primary-dark: #0047b3;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    /* ── Titlebar ── */
    .titlebar {
      -webkit-app-region: drag;
      height: 44px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .titlebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.3px;
    }
    .titlebar-logo span { font-size: 20px; }
    .titlebar-actions { -webkit-app-region: no-drag; display: flex; gap: 6px; }
    .titlebar-btn {
      width: 28px; height: 28px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .titlebar-btn:hover { background: rgba(255,255,255,0.25); }

    /* ── Screens ── */
    .screen { display: none; flex-direction: column; height: calc(100vh - 44px); overflow-y: auto; }
    .screen.active { display: flex; }

    /* ── Login ── */
    #login-screen {
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 24px;
    }
    .login-logo { font-size: 48px; }
    .login-title { font-size: 22px; font-weight: 900; color: var(--text); text-align: center; }
    .login-sub { font-size: 13px; color: var(--muted); text-align: center; }
    .form-group { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .form-group input {
      width: 100%; height: 44px; padding: 0 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 14px; outline: none; background: var(--card);
      transition: border-color .15s;
    }
    .form-group input:focus { border-color: var(--primary); }
    .password-field { position: relative; width: 100%; }
    .password-field input { padding-right: 40px; }
    .password-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      font-size: 15px; line-height: 1; color: var(--muted);
    }
    .password-toggle:hover { color: var(--text); }
    .btn {
      width: 100%; height: 44px; border-radius: 12px; border: none;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--bg); }
    .error-msg { font-size: 12px; color: var(--red); text-align: center; min-height: 16px; }

    /* ── Dashboard ── */
    #dashboard-screen { padding: 20px; gap: 16px; }

    .user-card {
      background: var(--primary);
      border-radius: 16px;
      padding: 18px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 14px;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: #fff; flex-shrink: 0;
    }
    .user-name { font-size: 16px; font-weight: 800; }
    .user-role { font-size: 12px; opacity: .75; margin-top: 2px; }

    .tracker-card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tracker-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .tracker-time {
      font-size: 40px; font-weight: 900; color: var(--text);
      letter-spacing: -2px; line-height: 1;
    }
    .tracker-status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 8px;
      width: fit-content;
    }
    .status-idle    { background: #f3f4f6; color: var(--muted); }
    .status-active  { background: #dcfce7; color: var(--green); }
    .status-paused  { background: #fff7ed; color: var(--orange); }
    .status-break   { background: #fff7ed; color: var(--orange); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .tracker-actions { display: flex; gap: 8px; }
    .tracker-actions .btn { flex: 1; height: 40px; font-size: 13px; border-radius: 10px; }
    .btn-green  { background: #16a34a; color: #fff; border: none; }
    .btn-green:hover  { background: #15803d; }
    .btn-red    { background: #dc2626; color: #fff; border: none; }
    .btn-red:hover    { background: #b91c1c; }
    .btn-orange { background: #ea580c; color: #fff; border: none; }
    .btn-orange:hover { background: #c2410c; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card {
      background: var(--card); border-radius: 14px;
      padding: 14px; border: 1.5px solid var(--border);
    }
    .stat-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .stat-value { font-size: 18px; font-weight: 900; color: var(--text); }

    .action-row { display: flex; gap: 8px; }
    .action-row .btn { flex: 1; height: 40px; font-size: 12px; border-radius: 10px; }

    .screenshot-indicator {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--muted); font-weight: 600;
      background: var(--card); border-radius: 10px;
      padding: 10px 14px; border: 1.5px solid var(--border);
    }
    .ss-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex-shrink: 0; }
    .ss-dot.active { background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .logout-btn {
      background: none; border: none; color: var(--muted);
      font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; padding: 4px;
    }
    .logout-btn:hover { color: var(--red); }

    .ss-count { margin-left: auto; font-size: 10px; color: var(--muted); }

    /* ── Update overlay ── */
    .update-backdrop {
      display: none;
      position: fixed; inset: 0; top: 44px;
      background: rgba(17,24,39,0.55);
      align-items: center; justify-content: center;
      padding: 20px;
      z-index: 500;
    }
    .update-backdrop.active { display: flex; }
    .update-card {
      background: var(--card); border-radius: 18px;
      padding: 22px; width: 100%;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .update-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: #eff6ff; color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .update-icon.force { background: #fef2f2; color: var(--red); }
    .update-title { font-size: 16px; font-weight: 900; color: var(--text); }
    .update-subtitle { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .update-subtitle.force { color: var(--red); font-weight: 700; }
    .whats-new-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }
    .whats-new-list { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text); max-height: 140px; overflow-y: auto; }
    .whats-new-list li { display: flex; gap: 8px; align-items: flex-start; }
    .whats-new-list li::before { content: '•'; color: var(--primary); font-weight: 900; }
    .update-actions { display: flex; gap: 8px; margin-top: 4px; }
    .update-actions .btn { flex: 1; height: 42px; font-size: 13px; border-radius: 10px; }

    .update-progress-track {
      width: 100%; height: 8px; border-radius: 4px;
      background: var(--border); overflow: hidden;
    }
    .update-progress-fill {
      height: 100%; background: var(--primary); border-radius: 4px;
      transition: width .2s ease; width: 0%;
    }
    .update-progress-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 600; }
    .update-progress-percent { font-size: 26px; font-weight: 900; color: var(--text); }
    .update-dismiss-link {
      background: none; border: none; color: var(--muted);
      font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; padding: 4px;
      text-decoration: underline;
    }

    /* ── Background update indicator — small, non-blocking pill shown only
       while a silent download is in flight. Never covers the screen and
       never stops clicks anywhere else; the employee can ignore it
       entirely. See renderUpdateIndicator/renderUpdateProgress/
       renderUpdateError in renderer.js and Round 3's "Background Silent
       Updates" — the full-screen backdrop is reserved for Ready-to-Install
       only. ── */
    .update-indicator {
      display: none;
      position: fixed; left: 10px; bottom: 10px; right: 10px;
      align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      font-size: 12px; font-weight: 600; color: var(--muted);
      z-index: 400; /* below .update-backdrop (500) so Ready-to-Install always wins */
    }
    .update-indicator.active { display: flex; }
    .update-indicator.failed { color: var(--red); border-color: var(--red); }
    .update-indicator-spinner {
      width: 13px; height: 13px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--primary);
      animation: update-indicator-spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes update-indicator-spin { to { transform: rotate(360deg); } }
    .update-indicator-icon { font-size: 13px; flex-shrink: 0; }
    .update-indicator-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .update-indicator-retry {
      background: none; border: none; color: inherit; font: inherit;
      cursor: pointer; padding: 0; text-decoration: underline;
    }
  </style>
</head>
<body>

<!-- Titlebar -->
<div class="titlebar">
  <div class="titlebar-logo">
    <span>⚡</span> TEKxAI Agent
  </div>
  <div class="titlebar-actions">
    <button class="titlebar-btn" onclick="window.agent.openDashboard()" title="Open Dashboard">🌐</button>
    <button class="titlebar-btn" onclick="window.agent.minimizeWindow()" title="Minimize">−</button>
    <button class="titlebar-btn" onclick="window.agent.closeWindow()" title="Close">✕</button>
  </div>
</div>

<!-- Login Screen -->
<div id="login-screen" class="screen active">
  <div class="login-logo">⚡</div>
  <div>
    <div class="login-title">TEKxAI Agent</div>
    <div class="login-sub">Sign in to start tracking your time</div>
  </div>
  <div class="form-group">
    <label>Email</label>
    <input id="email" type="email" placeholder="you@tekxai.com" autocomplete="email" />
  </div>
  <div class="form-group">
    <label>Password</label>
    <div class="password-field">
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button type="button" class="password-toggle" id="password-toggle" onclick="togglePasswordVisibility()" title="Show password">
        <svg id="password-toggle-icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="password-toggle-icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.38 3.5M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
  </div>
  <div class="error-msg" id="login-error"></div>
  <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
</div>

<!-- Dashboard Screen -->
<div id="dashboard-screen" class="screen">
  <!-- User card -->
  <div class="user-card">
    <div class="avatar" id="user-avatar">?</div>
    <div>
      <div class="user-name" id="user-name">—</div>
      <div class="user-role" id="user-role">—</div>
    </div>
  </div>

  <!-- Time tracker -->
  <div class="tracker-card">
    <div class="tracker-label">Time Tracker</div>
    <div class="tracker-time" id="tracker-time">0h:00m:00s</div>
    <div class="tracker-status status-idle" id="tracker-status">
      <div class="dot"></div>
      <span id="status-text">Not clocked in</span>
    </div>
    <div class="tracker-actions" id="tracker-actions">
      <button class="btn btn-green" id="btn-clock-in" onclick="doClock('in')">▶ Clock In</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Today</div>
      <div class="stat-value" id="stat-today">0h 0m</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Check In</div>
      <div class="stat-value" id="stat-checkin">—</div>
    </div>
  </div>

  <!-- Screenshot indicator -->
  <div class="screenshot-indicator">
    <div class="ss-dot" id="ss-dot"></div>
    <span id="ss-label">Screenshots paused</span>
    <span class="ss-count" id="ss-count" style="display:none"></span>
  </div>

  <!-- Action row -->
  <div class="action-row">
    <button class="btn btn-outline" onclick="window.agent.openDashboard()">🌐 Dashboard</button>
    <button class="btn btn-outline logout-btn" onclick="doLogout()">Sign Out</button>
  </div>
</div>

<!-- Update overlay — full-screen backdrop/card, reserved for "Ready to
     Install" only (see renderer.js renderUpdateReady). Sits above both the
     login and dashboard screens (z-index 500) since a mandatory update must
     block the app before login too. -->
<div class="update-backdrop" id="update-backdrop">
  <div class="update-card" id="update-card"></div>
</div>

<!-- Background download indicator — small non-blocking pill, active only
     while a silent download is in flight (renderUpdateIndicator/
     renderUpdateProgress/renderUpdateError in renderer.js). -->
<div class="update-indicator" id="update-indicator"></div>

<!-- Mandatory Daily Report gate — reuses the same full-screen backdrop/card
     classes as the update overlay above (own id, so the two can never
     collide) but is populated separately (showReportRequiredModal in
     renderer.js). No "Skip Now"/dismiss path exists here — the only way
     out is submitting the report (opens the existing web Daily Report
     page) and retrying checkout; server-side enforcement in
     POST /timesheet/clock-out is the real boundary, this is just the UI. -->
<div class="update-backdrop" id="report-required-backdrop">
  <div class="update-card" id="report-required-card"></div>
</div>

<!-- Idle-triggered break notice — same reused backdrop/card classes, own id.
     Shown when a resync (refreshToday) finds status ON_BREAK with
     break_source IDLE (see summarize_today_entries in be-work), i.e. the
     scheduler's auto-checkout job put this session on break because no
     desktop activity was seen, not because the employee started a manual
     break. Resume Work is the ONLY way out — clicking it calls the existing
     break-end IPC (window.agent.breakEnd()), the same one manual breaks use.
     Detecting fresh local mouse/keyboard activity never auto-dismisses this;
     only an explicit click does (see maybeShowIdleBreakModal/resumeFromIdleBreak
     in renderer.js). -->
<div class="update-backdrop" id="idle-break-backdrop">
  <div class="update-card" id="idle-break-card"></div>
</div>


<script src="renderer.js"></script>
</body>
</html>
